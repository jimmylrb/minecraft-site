<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物图鉴 — 方块大陆</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .mob-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; justify-content: center; }
        .mob-filter {
            padding: 8px 18px; border: 2px solid var(--mc-border); border-radius: 20px;
            background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 600;
            transition: all 0.2s; font-family: inherit;
        }
        .mob-filter:hover { border-color: var(--mc-green); }
        .mob-filter.active { background: var(--mc-green); color: #fff; border-color: var(--mc-green); }
        .mob-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .mob-card {
            background: #fff; border: 2px solid var(--mc-border); border-radius: 10px;
            padding: 20px; box-shadow: var(--mc-shadow); cursor: pointer; transition: all 0.15s;
        }
        .mob-card:hover { transform: translateY(-3px); border-color: var(--mc-green); }
        .mob-icon { font-size: 2.6rem; display: block; text-align: center; margin-bottom: 10px; }
        .mob-icon img { image-rendering: pixelated; width: 64px; height: 48px; object-fit: contain; }
        .modal .m-icon img { image-rendering: pixelated; width: 96px; height: 72px; object-fit: contain; }
        .mob-name { font-weight: 700; text-align: center; font-size: 1.05rem; }
        .mob-tags { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
        .mob-tag { font-size: 0.7rem; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
        .tag-hostile { background: #fde8e8; color: #c0392b; }
        .tag-passive { background: #e8f8e8; color: #27ae60; }
        .tag-neutral { background: #fff3e0; color: #e67e22; }
        .tag-boss { background: #f3e8ff; color: #8e44ad; }
        .tag-dim { background: #eef2f7; color: #5d6d7e; }
        .mob-count { text-align: center; color: var(--mc-text-dim); font-size: 0.85rem; margin-bottom: 16px; }
        .empty-tip { text-align: center; color: var(--mc-text-dim); padding: 40px 0; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">⛏️ 方块大陆</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="wiki.html">百科首页</a></li>
                <li><a href="items.html">物品百科</a></li>
                <li><a href="recipes.html">合成配方</a></li>
                <li><a href="mobs.html" class="active">生物图鉴</a></li>
                <li><a href="enchantments.html">附魔药水</a></li>
                <li><a href="mods.html">Mod 百科</a></li>
                <li><a href="mod-downloads.html">Mod 下载</a></li>
                <li><a href="server.html">服务器</a></li>
                <li><a href="downloads.html">资源下载</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>👾 生物图鉴</h1>
            <p class="page-desc">主世界、下界、末地的所有生物，点击查看详情。</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="mob-toolbar" id="mob-filter">
                <button class="mob-filter active" onclick="setFilter('全部')">🌍 全部</button>
                <button class="mob-filter" onclick="setFilter('被动')">🐑 被动</button>
                <button class="mob-filter" onclick="setFilter('中立')">😐 中立</button>
                <button class="mob-filter" onclick="setFilter('敌对')">💢 敌对</button>
                <button class="mob-filter" onclick="setFilter('Boss')">👹 Boss</button>
            </div>
            <div class="mob-count" id="mob-count"></div>
            <div class="mob-grid" id="mob-grid"></div>
            <div class="empty-tip" id="empty-tip" style="display:none;">😅 没有找到相关生物。</div>
        </div>
    </section>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modal" onclick="event.stopPropagation()">
            <span class="m-icon" id="m-icon"></span>
            <h3 id="m-name"></h3>
            <div style="text-align:center;"><span class="m-type" id="m-type"></span></div>
            <div class="m-row"><div class="m-label">❤️ 生命值</div><div class="m-val" id="m-hp"></div></div>
            <div class="m-row"><div class="m-label">🎁 掉落物</div><div class="m-val" id="m-drops"></div></div>
            <div class="m-row"><div class="m-label">📍 生成地点</div><div class="m-val" id="m-spawn"></div></div>
            <div class="m-row"><div class="m-label">🌐 所在维度</div><div class="m-val" id="m-dim"></div></div>
            <div class="m-row"><div class="m-label">📖 介绍</div><div class="m-val" id="m-desc"></div></div>
            <button class="modal-close" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>⛏️ 方块大陆 · 我的世界玩家社区 · 非官方站点</p>
            <p class="footer-note">《我的世界》是 Mojang Studios 的商标。本站为玩家自制内容站，与 Mojang / Microsoft 无关。</p>
        </div>
    </footer>

    <script src="data/mobs.js"></script>
    <script src="data/mob_images.js"></script>
    <script>
        let currentFilter = '全部';

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.mob-filter').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mob-filter').forEach(b => {
                if (b.textContent.includes(type)) b.classList.add('active');
            });
            renderMobs();
        }

        function tagClass(type) {
            const map = { '被动': 'tag-passive', '中立': 'tag-neutral', '敌对': 'tag-hostile', 'Boss': 'tag-boss' };
            return map[type] || 'tag-neutral';
        }

        function renderMobs() {
            const grid = document.getElementById('mob-grid');
            const count = document.getElementById('mob-count');
            const empty = document.getElementById('empty-tip');

            const filtered = window.MC_MOBS.filter(m => currentFilter === '全部' || m.type === currentFilter);
            count.textContent = `共 ${filtered.length} 种生物`;
            empty.style.display = filtered.length === 0 ? 'block' : 'none';

            grid.innerHTML = filtered.map(m => {
                const img = (window.MC_MOB_IMAGES || {})[m.name];
                const iconHtml = img ? `<img src="${img}" alt="${m.name}">` : m.icon;
                return `
                <div class="mob-card" onclick="showDetail('${m.name}')">
                    <span class="mob-icon">${iconHtml}</span>
                    <div class="mob-name">${m.name}</div>
                    <div class="mob-tags">
                        <span class="mob-tag ${tagClass(m.type)}">${m.type}</span>
                        <span class="mob-tag tag-dim">${m.dim}</span>
                    </div>
                </div>
            `;}).join('');
        }

        function showDetail(name) {
            const m = window.MC_MOBS.find(x => x.name === name);
            if (!m) return;
            const img = (window.MC_MOB_IMAGES || {})[m.name];
            document.getElementById('m-icon').innerHTML = img ? `<img src="${img}" alt="${m.name}">` : m.icon;
            document.getElementById('m-name').textContent = m.name;
            document.getElementById('m-type').textContent = m.type;
            document.getElementById('m-hp').textContent = m.hp + ' 点';
            document.getElementById('m-drops').textContent = m.drops;
            document.getElementById('m-spawn').textContent = m.spawn;
            document.getElementById('m-dim').textContent = m.dim;
            document.getElementById('m-desc').textContent = m.desc;
            document.getElementById('modal-overlay').classList.add('show');
        }

        function closeModal(event) {
            if (event && event.target.id !== 'modal-overlay') return;
            document.getElementById('modal-overlay').classList.remove('show');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        renderMobs();
    </script>
</body>
</html>
